name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bash git coreutils util-linux grep sed gawk sqlite3 python3 bats nodejs bubblewrap
      - name: Permit user namespaces on the CI host
        run: |
          # Ubuntu can restrict unprivileged user namespaces through AppArmor.
          # Change only the disposable CI host. Do not remove sandbox flags.
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Run tests in an isolated sandbox
        shell: bash
        run: |
          set -euo pipefail
          mounts=()
          for path in /usr /bin /sbin /lib /lib64; do
            if [[ -e "$path" ]]; then
              mounts+=(--ro-bind "$path" "$path")
            fi
          done
          # No host HOME, runtime state, sockets, or network is available.
          # Both writable tmpfs mounts have a 512 MiB limit. The address-space
          # limit allows Node.js to reserve virtual memory for syntax checks.
          # Any namespace or mount failure stops CI; there is no fallback.
          timeout --signal=TERM --kill-after=10s 600s \
            prlimit --cpu=480 --as=17179869184 --nproc=256 --fsize=67108864 -- \
            bwrap --unshare-all --die-with-parent --new-session --clearenv \
              "${mounts[@]}" \
              --ro-bind "$GITHUB_WORKSPACE" /repo \
              --size 536870912 --tmpfs /tmp \
              --size 536870912 --tmpfs /scratch \
              --dir /scratch/home --dir /scratch/state \
              --dir /scratch/log --dir /scratch/signals \
              --proc /proc --dev /dev --chdir /repo \
              --setenv PATH /usr/bin:/bin \
              --setenv HOME /scratch/home \
              --setenv TMPDIR /tmp \
              --setenv LOG_DIR /scratch/log \
              --setenv LOG_FILE /scratch/log/opencode.log \
              --setenv DB_FILE /scratch/fixture.db \
              --setenv STATE_DIR /scratch/state \
              --setenv SIGNAL_DIR /scratch/signals \
              --setenv WARP_ROTATE /bin/true \
              --setenv ROTATE_NOTIFY 0 \
              --setenv ZEN_TEST_LIVE_REGISTRY 0 \
              --setenv GIT_CONFIG_COUNT 1 \
              --setenv GIT_CONFIG_KEY_0 safe.directory \
              --setenv GIT_CONFIG_VALUE_0 /repo \
              /bin/bash tests/run.sh
